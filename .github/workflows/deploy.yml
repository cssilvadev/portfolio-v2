name: Deploy to GitHub Pages

# The site was going stale because deploys were a manual, easy-to-forget
# step. This automates it: every push to main builds and publishes through
# GitHub's native Pages deployment (the "github-pages" environment), which
# is what this repo's Pages settings actually use.
#
# Requires Pages source = "GitHub Actions" (Settings -> Pages) and the
# "github-pages" environment's deployment branch restriction to allow
# "main" (Settings -> Environments -> github-pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: |
          npx tsc -b --noEmit
          npm run lint

      - name: Build
        env:
          VITE_CONTACT_FORM_ENABLED: ${{ vars.VITE_CONTACT_FORM_ENABLED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Security regression tests and dependency audit
        run: |
          npm run check:security
          npm audit --audit-level=high

      - name: Set up Deno for server functions
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6

      - name: Type-check server functions
        run: |
          deno check --frozen --config supabase/functions/deno.json supabase/functions/create-checkout-session/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/send-contact-message/index.ts
          deno test --frozen --config supabase/functions/deno.json supabase/functions/_shared/contact_test.ts
          deno audit --lock=supabase/functions/deno.lock

      - name: Validate static publication
        run: npm run check:publication

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
