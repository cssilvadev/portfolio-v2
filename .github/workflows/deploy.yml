name: Deploy to GitHub Pages

# The site was going stale because deploys were a manual, easy-to-forget
# step. This automates it: every push to main builds and publishes through
# GitHub's native Pages deployment (the "github-pages" environment), which
# is what this repo's Pages settings actually use.
#
# Requires Pages source = "GitHub Actions" (Settings -> Pages) and the
# "github-pages" environment's deployment branch restriction to allow
# "main" (Settings -> Environments -> github-pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: |
          npx tsc -b --noEmit
          npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
