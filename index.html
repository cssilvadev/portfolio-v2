<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Declare the saved theme before styles/React load, including on deep links.
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("theme") === "light") theme = "light";
        } catch (_) {
          // Storage can be unavailable; the default dark theme still works.
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="color-scheme"]').setAttribute(
          "content", theme === "light" ? "only light" : "dark"
        );
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content", theme === "light" ? "#f7f7f7" : "#000000"
        );
      })();
    </script>
    <title>Christian Silva — Full Stack & Firmware Engineer</title>
    <meta
      name="description"
      content="Portfolio of Christian Silva: full stack and firmware engineer working on STM32/ESP32 robotics, CAN bus networks, and interactive web systems."
    />
    <link rel="canonical" href="https://cssilvadev.github.io/portfolio-v2/" />
    <link rel="alternate" type="application/rss+xml" title="Christian Silva — Notes & Logs" href="/portfolio-v2/feed.xml" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cssilvadev.github.io/portfolio-v2/" />
    <meta property="og:title" content="Christian Silva — Full Stack & Firmware Engineer" />
    <meta property="og:description" content="Portfolio of Christian Silva: full stack and firmware engineer working on embedded systems, robotics, and interactive web systems." />
    <meta property="og:image" content="https://cssilvadev.github.io/portfolio-v2/images/me.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Christian Silva — Full Stack & Firmware Engineer" />
    <meta name="twitter:description" content="Portfolio of Christian Silva: full stack and firmware engineer working on embedded systems, robotics, and interactive web systems." />
    <meta name="twitter:image" content="https://cssilvadev.github.io/portfolio-v2/images/me.jpg" />
    <link rel="preload" href="/portfolio-v2/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/portfolio-v2/images/robot-transparent.png" as="image" type="image/png" fetchpriority="high" />

        "sameAs": [
          "https://github.com/cssilvadev",
          "https://www.linkedin.com/in/christian-silva-a70418236/"
        ]
      }
    </script>
    <script>
      // Reverses the redirect from 404.html: restores the real deep-link URL
      // before React Router mounts, so a direct visit or refresh works.
      (function () {
        var redirect = new URLSearchParams(location.search).get("redirect");
        if (redirect) {
          history.replaceState(null, "", "/portfolio-v2/" + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
