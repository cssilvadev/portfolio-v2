<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages is a static host: it has no server-side rewrite, so a
      // direct visit or refresh on any deep link (e.g. /portfolio-v2/notes/x)
      // hits this 404 page instead of the React app. This encodes the
      // requested path into a query string and redirects to index.html,
      // where a matching script restores the real URL before React Router
      // ever sees it. Pattern: https://github.com/rafgraham/spa-github-pages
      var base = "/portfolio-v2/";
      var path = location.pathname + location.search + location.hash;
      var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, "");
      location.replace(base + "?redirect=" + encodeURIComponent(rest));
    </script>
  </head>
  <body></body>
</html>
